name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Tools holen
        run: |
          apt-get update
          apt-get install -y wget unzip
          wget https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -j bannertool.zip "linux-x86_64/bannertool" -d /usr/local/bin
          wget https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          unzip makerom-v0.18-ubuntu_x86_64.zip makerom -d /usr/local/bin
          chmod a+x /usr/local/bin/bannertool /usr/local/bin/makerom
      - name: Bauen
        run: |
          make
          echo '' | base64 -d > icon.png
          echo '' | base64 -d > banner.png
          echo '' | base64 -d > silent.wav
          bannertool makesmdh -s "Buckshot Roulette" -l "Buckshot Roulette" -p "Autor" -i icon.png -o icon.icn
          bannertool makebanner -i banner.png -a silent.wav -o banner.bnr
          makerom -f cia -o buckshot.cia -DAPP_ENCRYPTED=false -rsf app.rsf -target t -exefslogo -elf buckshot.elf -icon icon.icn -banner banner.bnr
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            buckshot.cia
            buckshot.3dsx
